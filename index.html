<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

      integrales: {
        url: "https://youtube.com/playlist?list=PLeySRPnY35dEHnMLZGaNEXgHzJ2-TPLWw&si=xTjEi6Ed9Ky7lynv",

    // --- COMPONENTE MATEMÁTICO (KaTeX) ---
    function MathTex({ formula, display = false }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.katex) {
          try {
            window.katex.render(formula, containerRef.current, {
              displayMode: display,
              throwOnError: false
            });
          } catch (e) {
            containerRef.current.innerText = formula;
          }
        }
      }, [formula, display]);

      return <span ref={containerRef} />;
    }

    // --- ILUSTRACIONES GRÁFICAS EDUCATIVAS EN SVG ---
    function RuleGraphic({ type }) {
      switch (type) {
        case "limit-approach":
          return (
            <svg viewBox="0 0 320 120" className="w-full max-w-sm mx-auto h-24 bg-white rounded-lg border border-slate-200 p-2 shadow-inner">
              <line x1="20" y1="100" x2="300" y2="100" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow)" />
              <line x1="40" y1="110" x2="40" y2="10" stroke="#94a3b8" strokeWidth="2" />
              <path d="M 40,90 Q 140,75 160,40 T 290,20" fill="none" stroke="#f59e0b" strokeWidth="3" />
              <circle cx="160" cy="40" r="5" fill="#ffffff" stroke="#f59e0b" strokeWidth="3" />
              <line x1="160" y1="45" x2="160" y2="100" stroke="#cbd5e1" strokeDasharray="3 3" />
              <text x="156" y="115" fontSize="11" fill="#1e293b" fontWeight="bold">a</text>
              <line x1="120" y1="105" x2="150" y2="105" stroke="#3b82f6" strokeWidth="2" />
              <text x="122" y="117" fontSize="10" fill="#3b82f6">x → a⁻</text>
              <line x1="200" y1="105" x2="170" y2="105" stroke="#10b981" strokeWidth="2" />
              <text x="175" y="117" fontSize="10" fill="#10b981">a⁺ ← x</text>
              <text x="220" y="35" fontSize="11" fill="#b45309" fontWeight="bold">f(x) → L</text>
            </svg>
          );
        case "derivative-tangent":
          return (
            <svg viewBox="0 0 320 120" className="w-full max-w-sm mx-auto h-24 bg-white rounded-lg border border-slate-200 p-2 shadow-inner">
              <line x1="20" y1="100" x2="300" y2="100" stroke="#94a3b8" strokeWidth="2" />
              <line x1="40" y1="110" x2="40" y2="10" stroke="#94a3b8" strokeWidth="2" />
              <path d="M 50,95 Q 150,85 270,15" fill="none" stroke="#2563eb" strokeWidth="3" />
              <line x1="90" y1="95" x2="230" y2="25" stroke="#ef4444" strokeWidth="2.5" />
              <circle cx="160" cy="60" r="4.5" fill="#ef4444" />
              <text x="170" y="58" fontSize="11" fill="#b91c1c" fontWeight="bold">Punto (x, f(x))</text>
              <text x="170" y="74" fontSize="10" fill="#475569">Pendiente m = f'(x)</text>
              <text x="70" y="30" fontSize="10" fill="#1d4ed8" fontWeight="bold">Curva f(x)</text>
            </svg>
          );
        case "integral-area":
          return (
            <svg viewBox="0 0 320 120" className="w-full max-w-sm mx-auto h-24 bg-white rounded-lg border border-slate-200 p-2 shadow-inner">
              <line x1="20" y1="100" x2="300" y2="100" stroke="#94a3b8" strokeWidth="2" />
              <line x1="40" y1="110" x2="40" y2="10" stroke="#94a3b8" strokeWidth="2" />
              <path d="M 90,100 L 90,65 Q 160,35 230,55 L 230,100 Z" fill="#d1fae5" stroke="#10b981" strokeWidth="2" />
              <path d="M 50,85 Q 160,30 270,60" fill="none" stroke="#059669" strokeWidth="3" />
              <text x="86" y="114" fontSize="11" fill="#047857" fontWeight="bold">a</text>
              <text x="226" y="114" fontSize="11" fill="#047857" fontWeight="bold">b</text>
              <text x="130" y="80" fontSize="11" fill="#065f46" fontWeight="bold">Área = ∫ f(x) dx</text>
            </svg>
          );
        case "power-rule":
          return (
            <svg viewBox="0 0 320 100" className="w-full max-w-sm mx-auto h-20 bg-white rounded-lg border border-slate-200 p-2 shadow-inner">
              <rect x="25" y="20" width="75" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" />
              <text x="45" y="45" fontSize="16" fill="#1e3a8a" fontWeight="bold">x</text>
              <text x="56" y="37" fontSize="12" fill="#ef4444" fontWeight="bold">n</text>
              <path d="M 115,48 L 150,48" stroke="#3b82f6" strokeWidth="2" markerEnd="url(#arrow)" />

        default:
          return (
            <div className="flex items-center justify-center p-3 bg-slate-100 rounded-lg text-slate-500 text-xs">
              Esquema conceptual analítico
            </div>
          );
      }
    }

    // --- COMPONENTE DE BANNER YOUTUBE ---
    function VideoBanner({ topic }) {
      const data = YOUTUBE_LINKS[topic];
      const [showEmbed, setShowEmbed] = useState(false);
      if (!data) return null;

      return (
        <div className="bg-red-50 border border-red-200 rounded-2xl p-4 sm:p-5 shadow-sm space-y-3">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-red-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                ▶
              </div>
              <div>
                <p className="text-xs font-bold uppercase tracking-wider text-red-600">¿Prefieres aprender en video?</p>
                <h4 className="text-base font-bold text-slate-900">{data.title}</h4>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowEmbed(!showEmbed)}
                className="px-3.5 py-1.5 bg-white border border-red-300 hover:bg-red-100 text-red-700 text-xs font-bold rounded-lg transition"
              >
                {showEmbed ? "Ocultar reproductor" : "Ver video aquí"}
              </button>
              <a
                href={data.url}
                target="_blank"
                rel="noopener noreferrer"
                className="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg transition shadow-sm flex items-center gap-1.5"
              >
                <span>Abrir en YouTube</span>
                <span className="text-xs">↗</span>
              </a>
            </div>
          </div>

          {showEmbed && (
            <div className="pt-2">
              <div className="relative w-full rounded-xl overflow-hidden shadow" style={{ paddingBottom: "56.25%" }}>
                <iframe
                  className="absolute top-0 left-0 w-full h-full"
                  src={`https://www.youtube.com/embed/videoseries?list=${data.listId}`}
                  title={data.title}
                  frameBorder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen
                ></iframe>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- BASE DE DATOS DE REGLAS CON GUÍA FONÉTICA E ILUSTRACIONES ---
    const LESSONS_DATA = {
      limites: [
        {
          id: "lim-sustitucion",
          category: "Reglas Básicas",
          name: "Sustitución Directa",
          formula: "\\lim_{x \\to a} f(x) = f(a)",
          howToRead: "«El límite de f de x, cuando x tiende al valor a, es igual a evaluar la función f en el punto a».",
          when: "Es el primer paso obligado al resolver cualquier límite si la función no produce división por cero ni formas indeterminadas en ese punto.",
          graphicType: "limit-approach",
          example: "\\lim_{x \\to 2} (3x^2 - 4x + 1)",
          steps: [
            "Paso 1: Reemplazamos cada x por el valor numérico al que se acerca, en este caso 2.",
            "Paso 2: Escribimos la expresión: 3(2)^2 - 4(2) + 1.",
            "Paso 3: Calculamos la potencia: 2^2 = 4, obteniendo 3(4) - 8 + 1.",
            "Paso 4: Multiplicamos y sumamos: 12 - 8 + 1 = 5."
          ],
          result: "5",
          practice: { question: "Calcula \\lim_{x \\to 3} (2x + 4)", answer: "10" }
        },
        {
          id: "lim-constante-var",
          category: "Reglas Básicas",
          name: "Límite de una Constante y de la Variable",
          formula: "\\lim_{x \\to a} c = c \\qquad \\lim_{x \\to a} x = a",
          howToRead: "«El límite de una constante c cuando x tiende a a es la misma constante c; y el límite de x cuando x tiende a a es simplemente a».",
          when: "Una constante no cambia su valor sin importar hacia dónde se mueva x; y la variable x simplemente adopta el valor destino.",
          graphicType: "limit-approach",
          example: "\\lim_{x \\to 5} 9 = 9 \\qquad \\lim_{x \\to 5} x = 5",
          steps: [
            "Paso 1: Para el número constante 9: como no contiene la variable x, su valor sigue siendo 9.",
            "Paso 2: Para la variable x: adopta inmediatamente el valor 5."
          ],
          result: "9 \\text{ y } 5",
          practice: { question: "Calcula \\lim_{x \\to -4} (-7)", answer: "-7" }
        },
        {
          id: "lim-operaciones",
          category: "Reglas Básicas",
          name: "Límites de Suma, Resta, Producto y Cociente",
          formula: "\\lim_{x \\to a} [f(x) \\pm g(x)] = L \\pm M \\qquad \\lim_{x \\to a} \\frac{f(x)}{g(x)} = \\frac{L}{M}",
          howToRead: "«El límite de una suma o resta es la suma o resta de sus límites individuales. El límite de una división es la división de sus límites, siempre que el denominador no sea cero».",
          when: "Cuando calculamos operaciones combinadas entre funciones continuas, podemos evaluar el límite de cada parte por separado.",
          graphicType: "limit-approach",
          example: "\\lim_{x \\to 3} \\frac{x^2 + 1}{2x}",
          steps: [
            "Paso 1: Calculamos el límite del numerador sustituyendo x por 3: 3^2 + 1 = 9 + 1 = 10.",
            "Paso 2: Calculamos el límite del denominador sustituyendo x por 3: 2(3) = 6.",
            "Paso 3: Formamos la fracción: 10/6.",
            "Paso 4: Simplificamos dividiendo numerador y denominador entre 2: 5/3."
          ],
          result: "\\frac{5}{3}",
          practice: { question: "Calcula \\lim_{x \\to 2} (x^3 + 2)", answer: "10" }
        },
        {
          id: "lim-cero-sobre-cero",
          category: "Indeterminación 0/0",
          name: "Factorización al obtener 0/0",
          formula: "\\frac{0}{0} \\implies \\text{Indeterminación (Factorizar y cancelar)}",
          howToRead: "«Cero sobre cero es una forma indeterminada; se lee: no está determinado aún, debes factorizar la expresión, cancelar el factor común y volver a evaluar».",
          when: "Cuando al sustituir x directamente obtienes 0 en el numerador y 0 en el denominador. Indica que existe un factor común que anula ambos miembros.",
          graphicType: "limit-approach",
          example: "\\lim_{x \\to 3} \\frac{x^2 - 9}{x - 3}",
          steps: [
            "Paso 1: Intentamos sustitución directa: (3^2 - 9)/(3 - 3) = 0/0 (indeterminado).",
            "Paso 2: Factorizamos la diferencia de cuadrados en el numerador: x^2 - 9 = (x - 3)(x + 3).",
            "Paso 3: Cancelamos el binomio (x - 3) presente tanto arriba como abajo; queda (x + 3).",
            "Paso 4: Evaluamos el límite resultante sustituyendo x por 3: 3 + 3 = 6."
          ],
          result: "6",
          practice: { question: "Calcula \\lim_{x \\to 2} \\frac{x^2 - 4}{x - 2}", answer: "4" }
        },
        {
          id: "lim-conjugado",
          category: "Indeterminación 0/0",
          name: "Racionalización con el Conjugado",
          formula: "(\\sqrt{A} - B)(\\sqrt{A} + B) = A - B^2",
          howToRead: "«Raíz cuadrada de A menos B, multiplicado por su conjugado raíz cuadrada de A más B, es igual a A menos B al cuadrado».",
          when: "Cuando al evaluar se obtiene 0/0 y aparecen términos con raíces cuadradas sumando o restando.",
          graphicType: "limit-approach",
          example: "\\lim_{x \\to 4} \\frac{\\sqrt{x} - 2}{x - 4}",
          steps: [
            "Paso 1: Al evaluar en x = 4 se obtiene: (√4 - 2)/(4 - 4) = 0/0.",
            "Paso 2: Multiplicamos numerador y denominador por el conjugado (√x + 2).",
            "Paso 3: Aplicamos diferencia de cuadrados en el numerador: (√x)^2 - 2^2 = x - 4.",
            "Paso 4: Cancelamos (x - 4) del numerador con el denominador, dejando 1 / (√x + 2).",
            "Paso 5: Evaluamos en x = 4: 1 / (√4 + 2) = 1 / (2 + 2) = 1/4."
          ],
          result: "\\frac{1}{4}",
          practice: { question: "Calcula \\lim_{x \\to 9} \\frac{\\sqrt{x} - 3}{x - 9} (en fracción 1/6)", answer: "1/6" }
        },
        {
          id: "lim-infinito",
          category: "Límites al Infinito y Laterales",
          name: "Límites al Infinito",
          formula: "\\lim_{x \\to \\infty} \\frac{1}{x} = 0 \\qquad \\lim_{x \\to \\infty} \\frac{a x^n + \\dots}{b x^n + \\dots} = \\frac{a}{b}",
          howToRead: "«El límite de 1 sobre x, cuando x tiende a infinito positivo, es igual a cero. En polinomios racionales del mismo grado, el límite es el cociente de los coeficientes líderes a sobre b».",
          when: "Para funciones racionales cuando x crece sin límite: comparamos las potencias más altas de x tanto arriba como abajo.",
          graphicType: "limit-approach",
          example: "\\lim_{x \\to \\infty} \\frac{4x^2 + 5x}{2x^2 - 1}",
          steps: [
            "Paso 1: Identificamos el término de mayor exponente en x: es x^2 tanto en numerador como denominador.",
            "Paso 2: Como ambos tienen el mismo grado 2, los términos de menor grado (+5x y -1) se vuelven despreciables frente a x^2.",
            "Paso 3: Dividimos los coeficientes principales correspondientes a x^2: 4 / 2 = 2."
          ],
          result: "2",
          practice: { question: "Calcula \\lim_{x \\to \\infty} \\frac{6x^3 + 2}{3x^3 - 5}", answer: "2" }
        },
        {
          id: "lim-laterales",
          category: "Límites al Infinito y Laterales",
          name: "Límites Laterales",
          formula: "\\lim_{x \\to a^-} f(x) = \\lim_{x \\to a^+} f(x) = L \\iff \\lim_{x \\to a} f(x) = L",
          howToRead: "«El límite de f de x cuando x tiende a a por la izquierda (con signo menos) es igual al límite cuando x tiende a a por la derecha (con signo más) si y solo si el límite bilateral existe y vale L».",
          when: "Para garantizar que un límite exista, la función debe converger exactamente al mismo número por ambos costados.",
          graphicType: "limit-approach",
          example: "\\lim_{x \\to 1^-} f(x) = 3 \\quad \\text{y} \\quad \\lim_{x \\to 1^+} f(x) = 3",
          steps: [
            "Paso 1: Analizamos la aproximación por la izquierda hacia 1: da 3.",
            "Paso 2: Analizamos la aproximación por la derecha hacia 1: da 3.",
            "Paso 3: Al coincidir ambos valores numéricos, el límite general en x = 1 es 3."
          ],
          result: "3",
          practice: { question: "Si por izquierda da 4 y por derecha da 4, ¿cuál es el límite?", answer: "4" }
        }
      ],
      derivadas: [
        {
          id: "der-constante-x",
          category: "Reglas Básicas",
          name: "Derivada de una Constante y de la Variable x",
          formula: "\\frac{d}{dx}(c) = 0 \\qquad \\frac{d}{dx}(x) = 1",
          howToRead: "«La derivada respecto a x de una constante c es igual a cero; y la derivada de x respecto a x es igual a uno».",
          when: "Un valor constante no tiene cambio de pendiente (rapidez cero), mientras que la función lineal identidad y = x crece a razón constante de 1.",
          graphicType: "derivative-tangent",
          example: "f(x) = 7 \\implies f'(x) = 0 \\qquad g(x) = x \\implies g'(x) = 1",
          steps: [
            "Paso 1: Para el número 7, al no contener la variable x, su derivada es 0.",
            "Paso 2: Para la variable x aislada con exponente 1, su derivada es 1."
          ],
          result: "0 \\text{ y } 1",
          practice: { question: "¿Cuál es la derivada de f(x) = 45?", answer: "0" }
        },
        {
          id: "der-potencia",
          category: "Reglas Básicas",
          name: "Regla de la Potencia",
          formula: "\\frac{d}{dx}(x^n) = n \\cdot x^{n - 1}",
          howToRead: "«La derivada respecto a x de x elevado a la potencia n es igual al exponente n multiplicado por x elevado a la n menos uno».",
          when: "Se aplica a cualquier potencia de x (positiva, negativa o fraccionaria). El exponente pasa al frente multiplicando y luego se le resta 1.",
          graphicType: "power-rule",
          example: "f(x) = x^4",
          steps: [
            "Paso 1: Identificamos el exponente original n = 4.",
            "Paso 2: Bajamos el 4 a multiplicar al frente de x: 4 · x.",
            "Paso 3: Restamos 1 al exponente: 4 - 1 = 3.",
            "Paso 4: Unimos la expresión resultante: 4x^3."
          ],
          result: "4x^3",
          practice: { question: "¿Cuál es la derivada de x^5? (Escribe: 5x^4)", answer: "5x^4" }
        },
        {
          id: "der-multiplo-suma",
          category: "Reglas Básicas",
          name: "Múltiplo Constante, Suma y Resta",
          formula: "\\frac{d}{dx}[c \\cdot f(x)] = c \\cdot f'(x) \\qquad \\frac{d}{dx}(u \\pm v) = u' \\pm v'",
          howToRead: "«La derivada de una constante c por una función f de x es c por la derivada de f; y la derivada de u más o menos v es la derivada de u más o menos la derivada de v».",
          when: "Permite derivar polinomios término a término manteniendo intactos los coeficientes numéricos.",
          graphicType: "derivative-tangent",
          example: "f(x) = 5x^3 - 4x^2 + 6x - 9",
          steps: [
            "Paso 1: Derivada de 5x^3: conservamos el 5 y multiplicamos por la derivada de x^3 (3x^2): 5 · 3x^2 = 15x^2.",
            "Paso 2: Derivada de -4x^2: -4 · 2x^1 = -8x.",
            "Paso 3: Derivada de 6x: 6 · 1 = 6.",
            "Paso 4: Derivada de -9: es constante, su derivada da 0.",
            "Paso 5: Juntamos todos los términos: 15x^2 - 8x + 6."
          ],
          result: "15x^2 - 8x + 6",
          practice: { question: "¿Derivada de 3x^2 - 5x? (Ej: 6x - 5)", answer: "6x - 5" }
        },
        {
          id: "der-producto-cociente",
          category: "Operaciones",
          name: "Regla del Producto y del Cociente",
          formula: "(u \\cdot v)' = u'v + uv' \\qquad \\left(\\frac{u}{v}\\right)' = \\frac{u'v - uv'}{v^2}",
          howToRead: "«La derivada del producto u por v es la derivada del primero por el segundo sin derivar, más el primero sin derivar por la derivada del segundo. Para el cociente: la derivada del numerador por el denominador menos el numerador por la derivada del denominador, todo sobre el denominador al cuadrado».",
          when: "Indispensable cuando dos funciones que dependen de x se multiplican o se dividen entre sí.",
          graphicType: "derivative-tangent",
          example: "f(x) = \\frac{3x}{x + 2}",
          steps: [
            "Paso 1: Numerador u = 3x (con derivada u' = 3); Denominador v = x + 2 (con derivada v' = 1).",
            "Paso 2: Aplicamos la fórmula del cociente: [3(x + 2) - (3x)(1)] / (x + 2)^2.",
            "Paso 3: Desarrollamos el numerador: 3x + 6 - 3x = 6.",
            "Paso 4: Obtenemos el cociente final: 6 / (x + 2)^2."
          ],
          result: "\\frac{6}{(x + 2)^2}",
          practice: { question: "Si u=x^2 y v=x, ¿cuál es la derivada del producto x^2 * x (usando x^3)?", answer: "3x^2" }
        },
        {
          id: "der-cadena",
          category: "Operaciones",
          name: "Regla de la Cadena (Composición de Funciones)",
          formula: "\\frac{d}{dx}[f(g(x))] = f'(g(x)) \\cdot g'(x)",
          howToRead: "«La derivada de f compuesta con g de x es igual a la derivada de la función exterior evaluada en la interior g de x, multiplicada por la derivada de la función interior g prima de x».",
          when: "Se utiliza cuando una función está anidada dentro de otra, por ejemplo un polinomio elevado a una potencia o dentro de una raíz.",
          graphicType: "derivative-tangent",

        {

        {

    // --- NORMALIZADOR DE ENTRADAS ---
    function normalize(str) {
      return (str || "")
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/\\cdot/g, "")
        .replace(/\*/g, "")
        .replace(/([0-9]+)\/([0-9]+)/g, "$1/$2");
    }

    // --- COMPONENTE PRINCIPAL (APP) ---
    function App() {
      const [currentTab, setCurrentTab] = useState("home");
      const [searchQuery, setSearchQuery] = useState("");
      const [collapsedCategories, setCollapsedCategories] = useState({});

      const navigateTo = (tab) => {
        setCurrentTab(tab);
        setSearchQuery("");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const toggleCategory = (cat) => {
        setCollapsedCategories(prev => ({ ...prev, [cat]: !prev[cat] }));
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* DEFINICIÓN DE MARCADOR SVG */}
          <svg width="0" height="0" className="hidden">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
              </marker>
            </defs>
          </svg>

          {/* BARRA SUPERIOR DE NAVEGACIÓN */}
          <header className="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div
                onClick={() => navigateTo("home")}
                className="flex items-center gap-2 cursor-pointer font-black text-2xl tracking-tight text-blue-600 hover:opacity-90"
              >
                <span>📐 Mate<span className="text-slate-900">Fácil</span></span>
              </div>

              <nav className="flex items-center gap-1 sm:gap-2">
                {[
                  { id: "home", label: "Inicio" },
                  { id: "limites", label: "Límites" },
                  { id: "derivadas", label: "Derivadas" },
                  { id: "integrales", label: "Integrales" }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => navigateTo(item.id)}
                    className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                      currentTab === item.id
                        ? "bg-blue-600 text-white shadow-sm"
                        : "text-slate-600 hover:text-blue-600 hover:bg-slate-100"
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
            {currentTab === "home" && <HomeView onNavigate={navigateTo} />}
            {currentTab === "limites" && (
              <TopicView
                topic="limites"
                title="Límites Matemáticos"
                desc="Aprende a qué valor se aproxima una función paso a paso, con fórmulas, lectura y gráficos claros."
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                collapsedCategories={collapsedCategories}
                toggleCategory={toggleCategory}
                onBack={() => navigateTo("home")}
              />
            )}
            {currentTab === "derivadas" && (
              <TopicView
                topic="derivadas"
                title="Cálculo Diferencial: Derivadas"
                desc="Calcula la razón de cambio instantánea y la pendiente de la recta tangente con reglas paso a paso."
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                collapsedCategories={collapsedCategories}
                toggleCategory={toggleCategory}
                onBack={() => navigateTo("home")}
              />
            )}
            {currentTab === "integrales" && (
              <TopicView
                topic="integrales"
                title="Cálculo Integral"
                desc="Domina el cálculo de áreas y primitivas conociendo la constante de integración + C y el teorema fundamental."
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                collapsedCategories={collapsedCategories}
                toggleCategory={toggleCategory}
                onBack={() => navigateTo("home")}
              />
            )}
          </main>

          {/* PIE DE PÁGINA */}
          <footer className="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
            <p className="font-semibold text-slate-700">MateFácil &copy; Plataforma interactiva de matemáticas en español.</p>
            <p className="text-xs mt-1">Guías de lectura fonética, fórmulas con KaTeX, ilustraciones didácticas y ejemplos paso a paso.</p>
          </footer>
        </div>
      );

    }

    // --- VISTA DE CADA TEMA ---
    function TopicView({ topic, title, desc, searchQuery, setSearchQuery, collapsedCategories, toggleCategory, onBack }) {
      const lessons = LESSONS_DATA[topic] || [];
      const exercises = QUIZ_DATA[topic] || [];

      const filteredLessons = useMemo(() => {
        if (!searchQuery.trim()) return lessons;
        const q = searchQuery.toLowerCase();
        return lessons.filter(
          item =>
            item.name.toLowerCase().includes(q) ||
            item.category.toLowerCase().includes(q) ||
            item.howToRead.toLowerCase().includes(q) ||
            item.when.toLowerCase().includes(q)
        );
      }, [lessons, searchQuery]);

      const grouped = useMemo(() => {
        const groups = {};
        filteredLessons.forEach(l => {
          if (!groups[l.category]) groups[l.category] = [];
          groups[l.category].push(l);
        });
        return groups;
      }, [filteredLessons]);

      return (
        <div className="space-y-8">
          {/* Cabecera */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <button
                onClick={onBack}
                className="text-sm font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1 mb-2"
              >
                ← Volver al inicio
              </button>
              <h1 className="text-3xl font-black text-slate-900">{title}</h1>
              <p className="text-slate-600 text-sm mt-1">{desc}</p>
            </div>

            {/* Barra de Búsqueda */}
            <div className="w-full sm:w-72">
              <div className="relative">
                <input
                  type="text"
                  placeholder="🔍 Buscar regla o fórmula..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full px-4 py-2 rounded-xl border border-slate-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
                />
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery("")}
                    className="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-600"
                  >
                    Limpiar
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* BANNER DE VIDEO DE YOUTUBE */}
          <VideoBanner topic={topic} />

          {/* Tarjeta explicativa pedagógica */}
          {topic === "limites" && (
            <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl text-sm text-amber-900 space-y-1">
              <p className="font-bold">💡 ¿Qué es un límite y cómo interpretarlo?</p>
              <p>
                Un límite no describe lo que ocurre exactamente <em>sobre</em> el punto, sino <strong>hacia qué valor converge la función</strong> conforme la variable x se aproxima a ese número.
                Si al sustituir obtienes <MathTex formula="0/0" />, representa una <strong>indeterminación</strong>: no equivale a cero ni a infinito de antemano; requiere factorizar o racionalizar para despejar la indeterminación.
              </p>
            </div>
          )}

          {topic === "derivadas" && (
            <div className="bg-blue-50 border-l-4 border-blue-600 p-4 rounded-r-xl text-sm text-blue-900 space-y-1">
              <p className="font-bold">💡 ¿Qué representa la derivada y cómo leer el operador d/dx?</p>
              <p>
                La notación <MathTex formula="\frac{d}{dx}" /> se lee: <em>«la derivada respecto a la variable x»</em>. Geométricamente indica la <strong>pendiente de la recta tangente</strong> a la curva en cualquier punto (x, f(x)) y físicamente representa la <strong>razón de cambio instantánea</strong> de dicha variable.
              </p>
            </div>
          )}

          {topic === "integrales" && (
            <div className="bg-emerald-50 border-l-4 border-emerald-600 p-4 rounded-r-xl text-sm text-emerald-900 space-y-1">
              <p className="font-bold">💡 ¿Qué representa el símbolo de integral ∫ y el diferencial dx?</p>
              <p>
                El símbolo <MathTex formula="\int" /> proviene de una letra <em>S alargada</em> (suma infinita de rectángulos infinitesimales) y <MathTex formula="dx" /> indica el ancho infinitamente pequeño de la variable x. La constante <strong>+ C</strong> se incluye porque cualquier número fijo produce una derivada igual a cero, de modo que al revertir la operación existe una familia de funciones paralelas.
              </p>
            </div>
          )}

          {/* Listado de Reglas por Categorías Colapsables */}
          <div className="space-y-6">
            {Object.keys(grouped).length === 0 ? (
              <div className="text-center py-12 bg-white rounded-2xl border border-slate-200">
                <p className="text-slate-500">No se encontraron reglas que coincidan con "{searchQuery}".</p>
              </div>
            ) : (
              Object.entries(grouped).map(([category, items]) => {
                const isCollapsed = collapsedCategories[category];
                return (
                  <div key={category} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <button
                      onClick={() => toggleCategory(category)}
                      className="w-full px-6 py-4 bg-slate-50 hover:bg-slate-100 flex items-center justify-between text-left font-bold text-slate-800 border-b border-slate-200 transition"
                    >
                      <span>{category} <span className="text-xs font-normal text-slate-500">({items.length} {items.length === 1 ? "regla" : "reglas"})</span></span>
                      <span className="text-sm text-slate-500">{isCollapsed ? "▼ Mostrar contenido" : "▲ Ocultar"}</span>
                    </button>

                    {!isCollapsed && (
                      <div className="p-6 divide-y divide-slate-100 space-y-8">
                        {items.map((lesson) => (
                          <div key={lesson.id} className="pt-6 first:pt-0">
                            <LessonCard lesson={lesson} />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {/* SECCIÓN DE PRÁCTICA */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">
            <div>
              <span className="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full uppercase tracking-wider">
                Zona de Práctica
              </span>
              <h2 className="text-2xl font-black text-slate-900 mt-2">Pon a prueba tu aprendizaje</h2>
              <p className="text-slate-600 text-sm">Resuelve cada ejercicio, escribe tu resultado numérico o algebraico y compruébalo. Puedes desplegar la solución detallada cuando lo desees.</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {exercises.map((ex, idx) => (
                <ExerciseCard key={ex.id} exercise={ex} index={idx + 1} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- TARJETA DE REGLA COMPLETA ---
    function LessonCard({ lesson }) {
      const [userAns, setUserAns] = useState("");
      const [feedback, setFeedback] = useState(null);

      const checkPractice = () => {
        if (!userAns.trim()) return;
        const isOk = normalize(userAns) === normalize(lesson.practice.answer);
        setFeedback(isOk ? "correct" : "incorrect");
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h3 className="text-lg font-bold text-blue-900">{lesson.name}</h3>
            <span className="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg self-start sm:self-auto">
              Regla oficial
            </span>
          </div>

          {/* Fórmula principal */}
          <div className="bg-slate-50 border border-slate-200 p-3 rounded-xl text-center text-slate-900 font-medium">
            <MathTex formula={lesson.formula} display={true} />
          </div>

          {/* SECCIÓN 1: ¿CÓMO SE LEE LA REGLA Y LA FÓRMULA? */}
          <div className="bg-indigo-50/70 border border-indigo-200/80 rounded-xl p-3.5 text-sm space-y-1">
            <div className="flex items-center gap-1.5 text-indigo-900 font-bold text-xs uppercase tracking-wide">
              <span>🗣️</span>
              <span>¿Cómo se lee esta fórmula en voz alta?</span>
            </div>
            <p className="text-indigo-950 font-medium italic pl-1 leading-relaxed">
              {lesson.howToRead}
            </p>
          </div>

          {/* SECCIÓN 2: ILUSTRACIÓN / ESQUEMA CONCEPTUAL */}
          {lesson.graphicType && (
            <div className="space-y-1">
              <span className="text-xs font-bold text-slate-500 uppercase tracking-wider block">
                Interpretación gráfica:
              </span>
              <RuleGraphic type={lesson.graphicType} />
            </div>
          )}

          {/* Cuándo se utiliza */}
          <div className="text-sm text-slate-700">
            <span className="font-bold text-slate-900">¿Cuándo se utiliza? </span>
            {lesson.when}
          </div>

          {/* Ejemplo resuelto paso a paso */}
          <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-4 text-sm space-y-3">
            <div className="font-semibold text-blue-900 flex items-center justify-between">
              <span>Ejemplo resuelto:</span>
              <span className="text-xs font-mono bg-white px-2 py-0.5 rounded border border-blue-200">
                <MathTex formula={lesson.example} />
              </span>
            </div>

            <div className="space-y-1.5 pl-2 border-l-2 border-blue-300">
              {lesson.steps.map((st, i) => (
                <p key={i} className="text-slate-700 text-xs sm:text-sm">{st}</p>
              ))}
            </div>

            <div className="pt-2 border-t border-blue-100 flex items-center gap-2">
              <span className="font-bold text-slate-900 text-xs sm:text-sm">Resultado final:</span>
              <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-lg font-bold text-sm">
                <MathTex formula={lesson.result} />
              </span>
            </div>
          </div>

          {/* Mini-ejercicio interactivo */}
          <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 space-y-3">
            <div className="text-sm font-semibold text-slate-800 flex items-center gap-1.5">
              <span>✍️ Ejercicio para practicar:</span>
              <MathTex formula={lesson.practice.question} />
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <input
                type="text"
                placeholder="Escribe tu resultado..."
                value={userAns}
                onChange={(e) => {
                  setUserAns(e.target.value);
                  setFeedback(null);
                }}
                className="px-3 py-1.5 text-sm rounded-lg border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 w-48"
              />
              <button
                onClick={checkPractice}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition"
              >
                Comprobar
              </button>

              {feedback === "correct" && (
                <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded">
                  ¡Correcto! Excelente. 🎉
                </span>
              )}
              {feedback === "incorrect" && (
                <span className="text-xs font-bold text-rose-700 bg-rose-100 px-2 py-1 rounded">
                  Inténtalo de nuevo (Respuesta esperada: {lesson.practice.answer})
                </span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- TARJETA DE EJERCICIO DE PRÁCTICA ---
    function ExerciseCard({ exercise, index }) {
      const [inputVal, setInputVal] = useState("");
      const [status, setStatus] = useState(null);
      const [showSteps, setShowSteps] = useState(false);

      const handleCheck = () => {
        if (!inputVal.trim()) return;
        const ok = normalize(inputVal) === normalize(exercise.a);
        setStatus(ok ? "correct" : "incorrect");
      };

      const handleReset = () => {
        setInputVal("");
        setStatus(null);
        setShowSteps(false);
      };

      return (
        <div className="p-4 rounded-xl border border-slate-200 bg-slate-50 flex flex-col justify-between space-y-3">
          <div>
            <div className="flex items-center justify-between text-xs font-bold text-slate-500 mb-1">
              <span>Ejercicio #{index}</span>
              <span>{exercise.title}</span>
            </div>
            <div className="text-base font-bold text-slate-900 my-2">
              <MathTex formula={exercise.q} display={true} />
            </div>
          </div>

          <div className="space-y-2">
            <div className="flex items-center gap-2">
              <input
                type="text"
                placeholder="Escribe el resultado..."
                value={inputVal}
                onChange={(e) => {
                  setInputVal(e.target.value);
                  setStatus(null);
                }}
                disabled={status === "correct"}
                className="flex-1 px-3 py-1.5 text-sm rounded-lg border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <button
                onClick={handleCheck}
                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition"
              >
                Comprobar
              </button>
            </div>

            {status === "correct" && (
              <div className="p-2 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-lg flex items-center justify-between">
                <span>¡Muy bien! Respuesta correcta. 🎉</span>
                <button onClick={handleReset} className="underline text-emerald-900 ml-2">Reintentar</button>
              </div>
            )}
            {status === "incorrect" && (
              <div className="p-2 bg-rose-100 text-rose-800 text-xs font-bold rounded-lg flex items-center justify-between">
                <span>Aún no es correcta. ¡Inténtalo de nuevo!</span>
                <button onClick={handleReset} className="underline text-rose-900 ml-2">Borrar</button>
              </div>
            )}

            <div className="pt-1">
              <button
                onClick={() => setShowSteps(!showSteps)}
                className="text-xs text-slate-500 hover:text-slate-800 font-semibold underline"
              >
                {showSteps ? "Ocultar procedimiento" : "Ver solución paso a paso"}
              </button>
              {showSteps && (
                <div className="mt-2 p-3 bg-white rounded-lg border border-slate-200 text-xs text-slate-700 space-y-1">
                  <p className="font-bold text-slate-900">Procedimiento:</p>
                  <p>{exercise.steps}</p>
                  <p className="font-semibold text-emerald-700">Respuesta: {exercise.a}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // RENDERIZAR EN DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
